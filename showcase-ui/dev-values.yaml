namespace: showcase-ui-ns

service:
  name: ui
  image:
    repository: nginx
    tag: latest
  replicas: 1
  port: 80
  path: /
  env:
    NODE_ENV: development
    API_URL: "https://api.mydomain.com"
    BACKEND_API_KEY: $BACKEND_API_KEY
    AUTH_TOKEN: $UI_AUTH_TOKEN
  resources:
    limits:
      cpu: "200m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi" 