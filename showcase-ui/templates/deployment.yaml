apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Values.service.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.service.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.service.name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Values.service.name }}
    spec:
      containers:
      - name: {{ .Values.service.name }}
        image: "{{ .Values.service.image.repository }}:{{ .Values.service.image.tag }}"
        ports:
        - containerPort: {{ .Values.service.port }}
        env:
        {{- range $key, $value := .Values.service.env }}
        - name: {{ $key }}
          {{- if kindIs "string" $value }}
          value: {{ $value | quote }}
          {{- else }}
          {{- toYaml $value | nindent 10 }}
          {{- end }}
        {{- end }}
        resources: {{ toYaml .Values.service.resources | nindent 10 }} 